name: Sync upstream

on:
  schedule:
    # Daily at 03:00 UTC (11:00 CST)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Tag, commit SHA, or branch (leave blank to sync latest upstream/main)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream NodeWarden
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git and fetch upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/shuaiplus/nodewarden.git
          else
            git remote add upstream https://github.com/shuaiplus/nodewarden.git
          fi
          git fetch --prune upstream main --tags

      - name: Resolve target commit
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ inputs.target_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST_TAG=""

          if [ "$EVENT_NAME" = "schedule" ]; then
            LATEST_TAG="$(
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/shuaiplus/nodewarden/releases/latest" \
                | jq -r '.tag_name // empty'
            )"
            if [ -z "$LATEST_TAG" ]; then
              echo "::error::No stable release found in shuaiplus/nodewarden."
              exit 1
            fi
            TARGET_SHA="$(git rev-list -n 1 "refs/tags/${LATEST_TAG}" 2>/dev/null || true)"
            if [ -z "$TARGET_SHA" ]; then
              echo "::error::Release tag '${LATEST_TAG}' not found after fetching upstream tags."
              exit 1
            fi
            MODE="release"
            echo "Scheduled sync — latest upstream release: ${LATEST_TAG} (${TARGET_SHA})"
          elif [ -n "$TARGET_REF" ]; then
            case "$TARGET_REF" in
              *[!A-Za-z0-9._/-]* )
                echo "::error::Invalid target_ref: contains disallowed characters."
                exit 1
                ;;
            esac
            TARGET_SHA=""
            for candidate in "refs/tags/${TARGET_REF}" "refs/remotes/upstream/${TARGET_REF}" "${TARGET_REF}"; do
              if resolved="$(git rev-parse --verify "${candidate}^{commit}" 2>/dev/null)"; then
                TARGET_SHA="$resolved"
                break
              fi
            done
            if [ -z "$TARGET_SHA" ]; then
              echo "::error::Cannot resolve '${TARGET_REF}' to an upstream commit."
              exit 1
            fi
            MODE="manual-ref"
            echo "Manual sync — target '${TARGET_REF}' (${TARGET_SHA})"
          else
            TARGET_SHA="$(git rev-parse --verify "refs/remotes/upstream/main^{commit}")"
            MODE="manual-main"
            echo "Manual sync — latest upstream/main (${TARGET_SHA})"
          fi

          if git merge-base --is-ancestor "$TARGET_SHA" HEAD 2>/dev/null; then
            NEEDS_UPDATE="false"
            echo "Already up to date with ${TARGET_SHA} — skipping."
          else
            NEEDS_UPDATE="true"
            echo "Update needed — merging ${TARGET_SHA} into main."
          fi

          {
            echo "mode=${MODE}"
            echo "latest_tag=${LATEST_TAG}"
            echo "target_sha=${TARGET_SHA}"
            echo "needs_update=${NEEDS_UPDATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Merge upstream target
        if: steps.resolve.outputs.needs_update == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          LATEST_TAG: ${{ steps.resolve.outputs.latest_tag }}
        run: |
          set -euo pipefail
          MERGE_MSG="chore: sync upstream ${LATEST_TAG:-${TARGET_SHA:0:8}}"
          if ! git merge --no-edit -m "$MERGE_MSG" "$TARGET_SHA"; then
            if git status --porcelain | grep -qE '^(AA|UU|DU|UD) \.github/workflows/sync-upstream\.yml$'; then
              git checkout --ours -- .github/workflows/sync-upstream.yml
              git add .github/workflows/sync-upstream.yml
            fi
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Merge conflict detected outside sync-upstream.yml:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi

      - name: Push synced main
        if: steps.resolve.outputs.needs_update == 'true'
        shell: bash
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${SYNC_PAT:-$GH_TOKEN}"
          WORKFLOW_CHANGED="false"
          if git log --name-only --pretty=format: origin/main..HEAD -- .github/workflows/ | grep -q .; then
            WORKFLOW_CHANGED="true"
          fi

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          if ! git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin main; then
            if [ -z "$SYNC_PAT" ] && [ "$WORKFLOW_CHANGED" = "true" ]; then
              echo "::error::Upstream modified .github/workflows/, and default GITHUB_TOKEN cannot push workflow changes. Configure a repository secret named SYNC_PAT (with Contents + Workflows write permissions) or click 'Sync fork' once on GitHub."
            fi
            exit 1
          fi

      - name: Write job summary
        shell: bash
        env:
          MODE: ${{ steps.resolve.outputs.mode }}
          LATEST_TAG: ${{ steps.resolve.outputs.latest_tag }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          NEEDS_UPDATE: ${{ steps.resolve.outputs.needs_update }}
        run: |
          set -euo pipefail
          if [ "$NEEDS_UPDATE" = "true" ]; then
            {
              echo "### Synced upstream successfully"
              echo "- **Mode:** ${MODE}"
              echo "- **Release tag:** ${LATEST_TAG:-N/A}"
              echo "- **Target commit:** \`${TARGET_SHA}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Already up to date"
              echo "- **Mode:** ${MODE}"
              echo "- **Release tag:** ${LATEST_TAG:-N/A}"
              echo "- **Target commit:** \`${TARGET_SHA}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
